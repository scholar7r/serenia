name: Testing
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Unit Test
        run: go test -race ./...
