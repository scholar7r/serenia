name: Lint
on:
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
